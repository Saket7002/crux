id: health-endpoint-15
stratum: one_liner
prompt: "add a /health endpoint that returns 200 without a bearer token"
fixture_repo: fastapi_service
max_questions: 3
must_surface:
  - match: "whether the health check verifies downstream dependencies like Redis"
must_not_surface:
  - id: software.tests.expectations
  - id: software.deps.policy
  - id: software.compat.breaking
  - match: "whether the endpoint requires authentication"
must_resolve_by_retrieval:
  - id: software.target.files
expected:
  task_should:
    - "add an unauthenticated GET /health returning 200"
  constraints_should:
    - "the endpoint does not use the bearer-token dependency"
  assumptions_should_cite:
    - "whether the check also verifies Redis or the database"
  must_not_claim:
    - "that the endpoint should require authentication"
