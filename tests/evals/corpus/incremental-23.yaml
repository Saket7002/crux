id: incremental-23
stratum: feature
prompt: >
  The daily_active_users model is getting slow because it rebuilds everything.
  Make it incremental.
fixture_repo: data_pipeline
max_questions: 4
must_surface:
  - match: "how far back an incremental run reprocesses"
  - match: "how the first incremental run backfills history"
must_not_surface:
  - id: software.tests.expectations
  - id: software.deps.policy
must_resolve_by_retrieval:
  - id: software.target.files
expected:
  task_should:
    - "change marts.daily_active_users from a full rebuild to an incremental update"
  assumptions_should_cite:
    - "how many days each run reprocesses"
    - "how existing history is seeded on the first run"
  must_not_claim:
    - "that a new tool such as dbt must be added"
