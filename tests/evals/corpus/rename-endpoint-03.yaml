id: rename-endpoint-03
stratum: one_liner
prompt: "rename the items endpoint to products"
fixture_repo: fastapi_service
max_questions: 3
must_surface:
  - id: software.compat.breaking
must_not_surface:
  - id: software.tests.expectations
must_resolve_by_retrieval:
  - id: software.target.files
expected:
  task_should:
    - "rename the /api/v2/items routes to /api/v2/products"
  constraints_should:
    - "existing callers of the items path are either kept working or explicitly broken"
  assumptions_should_cite:
    - "whether breaking existing callers is acceptable"
  must_not_claim:
    - "that the items endpoint has no callers"
