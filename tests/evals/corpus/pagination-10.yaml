id: pagination-10
stratum: one_liner
prompt: "add pagination to the items list"
fixture_repo: fastapi_service
max_questions: 3
must_surface:
  - id: software.compat.breaking
  - match: "cursor or offset based paging"
must_not_surface:
  - id: software.tests.expectations
  - id: software.deps.policy
must_resolve_by_retrieval:
  - id: software.target.files
expected:
  task_should:
    - "paginate GET /api/v2/items"
  constraints_should:
    - "the current unpaginated response shape is either preserved or knowingly broken"
  assumptions_should_cite:
    - "how many items a page holds by default"
    - "whether paging is cursor or offset based"
  must_not_claim:
    - "that the items list already supports paging parameters"
