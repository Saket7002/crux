id: auth-refresh-05
author: vedanshu
stratum: feature
prompt: >
  Add refresh tokens so people stop getting logged out. Keep it compatible with
  the mobile clients that are already shipped.
fixture_repo: next_dashboard
max_questions: 4
must_surface:
  - id: software.compat.breaking
  - match: "how long a refresh token stays valid"
  - match: "where refresh tokens are stored"
must_resolve_by_retrieval:
  - id: software.deps.policy
expected:
  task_should:
    - "add refresh tokens alongside the existing cookie-based sessions"
  constraints_should:
    - "shipped mobile clients keep working without an update"
  assumptions_should_cite:
    - "how long a refresh token stays valid"
    - "where refresh tokens are stored"
  must_not_claim:
    - "that tokens are currently kept in local storage"
