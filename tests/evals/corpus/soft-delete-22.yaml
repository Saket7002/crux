id: soft-delete-22
author: claude
stratum: feature
prompt: >
  Items should be soft-deleted so support can restore them. The existing API
  contract must not change; clients keep calling DELETE and seeing the item gone.
fixture_repo: fastapi_service
max_questions: 4
must_surface:
  - match: "how long a deleted item stays restorable"
  - match: "whether soft-deleted items are excluded from list results"
must_not_surface:
  - id: software.tests.expectations
  - id: software.compat.breaking
must_resolve_by_retrieval:
  - id: software.target.files
expected:
  task_should:
    - "mark items deleted instead of removing rows, with a support-only restore"
  constraints_should:
    - "the DELETE contract and client-visible behaviour do not change"
  assumptions_should_cite:
    - "how long a deleted item remains restorable"
  must_not_claim:
    - "that breaking existing callers is acceptable"
