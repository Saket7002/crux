id: notifications-04
stratum: feature
prompt: >
  Add notifications to the app. Users should find out when something they care
  about happens, and they should be able to turn them off.
fixture_repo: fastapi_service
max_questions: 4
must_surface:
  - id: software.scope.build
  - match: "which delivery channel notifications use"
  - match: "which events trigger a notification"
  - match: "how a user opts out"
must_not_surface:
  - id: software.tests.expectations
expected:
  task_should:
    - "add notifications with a per-user opt-out"
  constraints_should:
    - "users can turn notifications off"
  assumptions_should_cite:
    - "which delivery channel notifications use"
    - "which events trigger a notification"
  must_not_claim:
    - "that an email or push provider is already configured in the repo"
