id: rate-limit-01
stratum: one_liner
prompt: "add rate limiting to the API"
fixture_repo: fastapi_service
max_questions: 3
must_surface:
  - id: software.scope.build
  - match: "which endpoints the limit applies to"
  - match: "how callers are identified for counting"
must_not_surface:
  - id: software.tests.expectations
  - id: software.deps.policy
must_resolve_by_retrieval:
  - id: software.target.files
expected:
  task_should:
    - "describe adding rate limiting to the existing FastAPI service, not a new service"
    - "leave which endpoints are limited as an open decision or a stated assumption"
  constraints_should:
    - "limits are counted per caller identity, not globally"
  assumptions_should_cite:
    - "how callers are identified for counting"
    - "Redis as the counter store, because the repo already uses it"
  must_not_claim:
    - "that a rate-limit middleware already exists in the repo"
