id: rbac-19
stratum: feature
prompt: >
  Add roles to the dashboard. Some people should only be able to view, others
  can edit, and a few can manage the organisation.
fixture_repo: next_dashboard
max_questions: 4
must_surface:
  - id: software.compat.breaking
  - match: "where role assignments are stored"
  - match: "whether the API enforces roles or only the UI"
must_not_surface:
  - id: software.tests.expectations
must_resolve_by_retrieval:
  - id: software.deps.policy
expected:
  task_should:
    - "add viewer, editor and org-admin roles to the dashboard"
  constraints_should:
    - "roles are enforced by the API, not just hidden in the UI"
  assumptions_should_cite:
    - "where role assignments live"
    - "what existing users default to"
  must_not_claim:
    - "that the session already carries a role field"
