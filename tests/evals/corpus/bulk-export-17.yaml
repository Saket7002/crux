id: bulk-export-17
author: claude
stratum: feature
prompt: >
  Let users export all their items as a file. Big accounts have hundreds of
  thousands of items, so it cannot just be a bigger list endpoint.
fixture_repo: fastapi_service
max_questions: 4
must_surface:
  - id: software.scope.build
  - match: "file format of the export"
  - match: "whether the export runs synchronously or as a background job"
must_not_surface:
  - id: software.tests.expectations
must_resolve_by_retrieval:
  - id: software.target.files
expected:
  task_should:
    - "add an export of a user's items that handles hundreds of thousands of rows"
  constraints_should:
    - "the export is not a synchronous bigger list response"
  assumptions_should_cite:
    - "the file format"
    - "where the finished file is stored and how the user fetches it"
  must_not_claim:
    - "that a background job system already exists in the FastAPI service"
