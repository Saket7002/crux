version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    # litellm moves fast and crux deliberately tracks it, so patch noise is not
    # worth a PR each. Minor and major are.
    ignore:
      - dependency-name: "litellm"
        update-types: ["version-update:semver-patch"]
